# Cross-origin access to the basemap assets of map.rns.moscow.
#
# Included from each asset location in wardrive-map-assets.conf. Pairs with
# "public_url" in wardrive_map.json, which makes Flask send the same headers on
# /basemap/ and emit absolute URLs in the styles it serves there.
#
# The assets are public map data with no cookies or credentials involved, so any
# origin may read them.

add_header Access-Control-Allow-Origin "*" always;
# pmtiles.js reads the archive in byte ranges and inspects these on the way back.
add_header Access-Control-Allow-Headers "Range" always;
add_header Access-Control-Expose-Headers "Content-Range, Content-Length, ETag, Accept-Ranges" always;

# A single-range Range header is CORS-safelisted in current browsers, so a preflight is
# rare -- but older ones send it, and nginx answers OPTIONS on a static file with 405.
# This "if" only returns, which is the one use of "if" in a location that is safe.
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    add_header Access-Control-Allow-Headers "Range";
    add_header Access-Control-Max-Age 86400;
    return 204;
}
