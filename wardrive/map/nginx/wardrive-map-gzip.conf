# Compression for map.rns.moscow.
#
# Scoped to this vhost rather than the http block on purpose: this nginx fronts ~50
# other services, and turning compression on for all of them is a much wider change
# than the map needs.
#
# Everything Flask returns is highly compressible -- the page is one large inline
# HTML/CSS/JS blob, and the API is JSON. Measured: / 74125 -> 20090 (73%),
# /api/discovered 170561 -> 36298 (79%), /api/geojson 6257 -> 649 (90%).

gzip              on;
gzip_vary         on;
gzip_comp_level   5;
gzip_min_length   1024;

# Responses reach us through proxy_pass, which nginx will not compress by default.
gzip_proxied      any;

# Deliberately excludes application/octet-stream. The .pmtiles archive is served under
# that type and is fetched with Range requests; nginx cannot serve a range out of a
# gzipped response, so compressing it would break every basemap tile. Vector tiles and
# glyph .pbf files are already compressed internally anyway.
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/geo+json
    image/svg+xml;
