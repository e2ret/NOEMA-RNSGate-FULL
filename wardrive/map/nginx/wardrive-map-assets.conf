# Self-hosted basemap assets for map.rns.moscow.
#
# Included inside the server block of proxy-vhosts.d/map.rns.moscow.conf, ahead of the
# catch-all "location /" that proxies to Flask. These paths are served straight off
# disk instead: the .pmtiles archive is read with one HTTP range request per tile, and
# routing those through Python would add latency to every tile of every pan.
#
# Assets live on the tileset volume, which is deliberately outside the code tree --
# the basemap is far too large to version.
#
# Each location includes wardrive-map-cors.conf so other installs can use this one as
# their "remote" basemap provider. It is an include rather than server-level add_header
# because nginx drops inherited add_header lines in any block that sets its own, which
# every location below does.

location /tiles/ {
    alias /mnt/sdb1/tilesets/static/tiles/;
    include /etc/nginx/wardrive-map-cors.conf;
    # pmtiles.js addresses slices of one large archive; nginx answers Range requests
    # for static files natively, which is the whole reason no tile server is needed.
    types { }
    default_type application/octet-stream;
    # nginx cannot serve a byte range out of a gzipped response, and pmtiles.js needs
    # ranges for every tile. gzip_types already excludes octet-stream; this is explicit.
    gzip off;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

location /fonts/ {
    alias /mnt/sdb1/tilesets/static/fonts/;
    include /etc/nginx/wardrive-map-cors.conf;
    # Glyph .pbf files are protobuf, already compact, and never change once composed.
    types { }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

location /sprite/ {
    alias /mnt/sdb1/tilesets/static/sprite/;
    include /etc/nginx/wardrive-map-cors.conf;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}

location /static/ {
    alias /mnt/sdb1/tilesets/static/;
    include /etc/nginx/wardrive-map-cors.conf;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}
