# Admin page of the community overlay on map.rns.moscow, guarded by Authelia. It can change data (ban,
# remove sessions, rotate tokens), so keep the Authelia rule below to admins and consider two_factor for it.
# (map/overlay_admin_web.py, running on 127.0.0.1:8850 as the wardrive-overlay-admin service).
#
# ---- nginx side (this file) ---------------------------------------------------------
#
#   1. The zone line below goes in the http context. Every file in /etc/nginx/proxy-vhosts.d/
#      is included inside http {} on this server, so put it at the very top of
#      map.rns.moscow.conf, above "server {":
#
#        limit_req_zone $binary_remote_addr zone=wardrive_overlay_admin:10m rate=30r/m;
#
#   2. Include this file inside the map.rns.moscow server block, next to the other
#      wardrive-map-*.conf includes:
#
#        include /etc/nginx/wardrive-map-admin.conf;
#
#      It pulls in /etc/nginx/authelia/authelia-location.conf itself (the internal
#      /internal/authelia/authz endpoint). Do NOT also uncomment that include in the
#      vhost, or nginx rejects the duplicate location. If the whole vhost is ever
#      moved behind Authelia, delete the include below and use the vhost's own.
#
# ---- Authelia side (NOT done by this repo; edit /opt/authelia/config/configuration.yml) --
#
# Authelia is currently set up for geekpilot.ru only, and its default policy is "deny",
# so without these three things every request to /overlay-admin is a 403 or a broken redirect:
#
#   a. A session cookie for the rns.moscow domain, whose portal is a host UNDER that domain
#      (a cookie cannot cross to geekpilot.ru). Needs a DNS name, an nginx vhost proxying to
#      Authelia, and a certificate for it:
#
#        session:
#          cookies:
#            - name: 'authelia_session'                  # existing geekpilot.ru entry stays
#              domain: 'geekpilot.ru'
#              authelia_url: 'https://auth.geekpilot.ru'
#            - name: 'authelia_session_rns'
#              domain: 'rns.moscow'
#              authelia_url: 'https://auth.rns.moscow'
#              default_redirection_url: 'https://map.rns.moscow'
#
#   b. An access rule, kept as narrow as the page is. Only admins should see contributor
#      names and exact coordinates:
#
#        access_control:
#          rules:
#            - domain: 'map.rns.moscow'
#              resources: ['^/overlay-admin(/.*)?$']
#              policy: 'one_factor'                      # or 'two_factor'
#              subject: [['group:admins']]
#
#   c. Reload Authelia afterwards (restart the service).
#
# ---- Defence in depth ----------------------------------------------------------------
#
# The app refuses any request that arrives without X-Remote-User, which this file sets to
# Authelia's user name. If the auth_request include below is deleted, "$user" is no longer a
# defined variable and "nginx -t" fails to load the config; if Authelia says no, nginx
# returns its 401/403 before the app is reached. Nothing here fails open.
#
# Plain password instead of Authelia: replace the include of authelia-authrequest.conf and
# the X-Remote-User line with
#     auth_basic "Community overlay admin";
#     auth_basic_user_file /etc/nginx/wardrive-overlay-admin.htpasswd;   # openssl passwd -apr1
#     proxy_set_header X-Remote-User $remote_user;
# (not /etc/nginx/basic-auth.conf: its "satisfy any" lets private ranges skip the password).

include /etc/nginx/authelia/authelia-location.conf;

# "^~" so no regex location elsewhere in the vhost can capture these paths, and no trailing
# slash so "/overlay-admin" itself is protected too (the app redirects it to the slash form).
location ^~ /overlay-admin {
    # Sets $user from Authelia, redirects the browser to the portal on 401, and adds
    # Remote-User/-Groups/-Email/-Name for the upstream.
    include /etc/nginx/authelia/authelia-authrequest.conf;

    # A flood guard, not the password defence (Authelia does its own regulation). Runs before
    # the auth subrequest, so it also keeps unauthenticated hammering off Authelia.
    limit_req         zone=wardrive_overlay_admin burst=20 nodelay;
    limit_req_status  429;

    proxy_pass         http://127.0.0.1:8850;     # no URI part: the path reaches the app unchanged
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;   # the app only answers to the names it was configured with
    proxy_set_header   X-Remote-User     $user;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    # Cache-Control, X-Robots-Tag and the CSP are set by the app.
}
