# Add inside wardrive-map-assets.conf, next to "location /tiles/ { ... }" (longer prefix wins, so the
# existing range-request archive at /tiles/basemap.pmtiles is untouched).
#
# Plain per-tile URLs for clients that cannot read pmtiles:// (MapLibre's offline downloader in the
# wardrive Android app). pmtiles serve answers /basemap/{z}/{x}/{y}.mvt out of the same archive.
location /tiles/z/ {
    proxy_pass http://127.0.0.1:8841/;
    proxy_set_header Host $host;
    # tiles are already gzip-compressed inside the archive; pass them through as served
    gzip off;
    add_header Cache-Control "public, max-age=86400";
    access_log off;
}
