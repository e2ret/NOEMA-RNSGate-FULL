# Community overlay endpoints of map.rns.moscow (needs "overlay_enabled": true in wardrive_map.json).
#
# Two pieces, because nginx only accepts limit_req_zone in the http context:
#
#   1. The two zones below go in the http context. On this server every file in
#      /etc/nginx/proxy-vhosts.d/ is included inside http {}, so the simplest place is the
#      very top of map.rns.moscow.conf, above "server {". (There is no conf.d/*.conf include,
#      so a file dropped in conf.d/ would silently not be loaded.)
#   2. Everything from "location" down is included inside the map.rns.moscow server block,
#      next to the other wardrive-map-*.conf includes. Regex locations beat the
#      catch-all "location /", so they win for their paths and leave the rest alone.
#
# The Flask app enforces the real limits (per-contributor quotas, body size, validation).
# This is the outer wall: it keeps a flood from reaching python at all, and it is what
# bounds the cost of guessing tokens or invite codes, which the app cannot see per client.
#
# ---- 1. http block ----------------------------------------------------------------------
#
#   limit_req_zone $binary_remote_addr zone=wardrive_overlay_write:10m rate=6r/m;
#   limit_req_zone $binary_remote_addr zone=wardrive_overlay_read:10m  rate=5r/s;
#
# ---- 2. server block --------------------------------------------------------------------

# Writes: uploads, minting an invite, redeeming one. 6 a minute per client with a small
# burst is plenty for a person and useless for brute-forcing a 128-bit invite code.
location ~ ^/api/overlay/(upload|invite|redeem)$ {
    limit_req         zone=wardrive_overlay_write burst=5 nodelay;
    limit_req_status  429;

    # An app export runs about 390 bytes a row, so 4 MB is roughly 10000 rows (the app splits
    # longer sessions into several files). Must be at least overlay_max_upload_bytes
    # (default 4 MiB) or nginx answers 413 before the app can explain itself.
    client_max_body_size 4m;
    # nginx buffers the whole body before passing it on (proxy_request_buffering is on by
    # default), so a client dribbling bytes ties up nginx, not a waitress thread.
    client_body_timeout  30s;

    # Same proxy settings as the catch-all "location /" -- copy any that vhost adds.
    # ProxyFix in map_server.py reads these three.
    proxy_pass         http://127.0.0.1:8840;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;

    # Token-bearing responses must never be cached by anything in between.
    add_header         Cache-Control "no-store" always;
    # Left in the access log on purpose: the app logs contributor and batch ids, nginx has
    # the client address, and tracing an abusive upload needs both. The default log format
    # does not record the Authorization header, so tokens do not end up there.
}

# Reads: the published overlay (public, up to 50000 rows per call) and /me (a bearer-token
# lookup, so it gets the same limit: it is what a token-guessing client would hammer).
location ~ ^/api/overlay(/me)?$ {
    limit_req         zone=wardrive_overlay_read burst=20 nodelay;
    limit_req_status  429;

    proxy_pass         http://127.0.0.1:8840;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
}
